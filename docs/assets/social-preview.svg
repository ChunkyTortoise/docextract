<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">DocExtract deterministic replay preview</title>
  <desc id="desc">Social preview for DocExtract highlighting a 95.5 percent field-level score from a deterministic 28-fixture replay, a two-pass extraction flow followed by an evaluation gate, and a separately labeled 202-case authoring corpus.</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bg { fill: #f7f9fc; }
    .card { fill: #fff; stroke: #c6d0de; }
    .ink { fill: #10213a; }
    .muted { fill: #526177; }
    .rule { stroke: #c6d0de; }
    .accentText { fill: #0f766e; }
    .accentFill { fill: #ccfbf1; }
    .blueText { fill: #0c4a6e; }
    .blueFill { fill: #e0f2fe; }
    .gateText { fill: #166534; }
    .gateFill { fill: #dcfce7; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #07111f; }
      .card { fill: #101c2e; stroke: #34445b; }
      .ink { fill: #f8fafc; }
      .muted { fill: #bac6d8; }
      .rule { stroke: #34445b; }
      .accentText { fill: #5eead4; }
      .accentFill { fill: #123c3b; }
      .blueText { fill: #7dd3fc; }
      .blueFill { fill: #12334a; }
      .gateText { fill: #86efac; }
      .gateFill { fill: #153d29; }
    }
  </style>
  <rect class="bg" width="1280" height="640"/>
  <text class="accentText" x="64" y="76" font-size="25" font-weight="750" letter-spacing="2">DOCEXTRACT</text>
  <text class="ink" x="64" y="137" font-size="48" font-weight="780">Deterministic proof first.</text>
  <text class="accentText" x="64" y="280" font-size="112" font-weight="800">95.5%</text>
  <text class="ink" x="70" y="327" font-size="31" font-weight="720">field-level score</text>
  <rect class="accentFill" x="66" y="360" width="420" height="54" rx="27"/>
  <text class="accentText" x="276" y="395" text-anchor="middle" font-size="22" font-weight="720">Deterministic 28-fixture replay</text>
  <text class="muted" x="66" y="466" font-size="23">Fixture-backed document intelligence</text>
  <text class="muted" x="66" y="501" font-size="23">with two-pass extraction and an eval gate.</text>
  <line class="rule" x1="600" y1="56" x2="600" y2="584" stroke-width="2"/>
  <text class="ink" x="654" y="105" font-size="31" font-weight="740">Inspect the system behind the score</text>
  <rect class="blueFill" x="654" y="148" width="178" height="98" rx="16"/>
  <text class="blueText" x="743" y="186" text-anchor="middle" font-size="19" font-weight="650">PASS 1</text>
  <text class="blueText" x="743" y="218" text-anchor="middle" font-size="23" font-weight="760">Extraction</text>
  <line class="rule" x1="842" y1="197" x2="872" y2="197" stroke-width="4"/>
  <path class="muted" d="M866 188 L878 197 L866 206 Z"/>
  <rect class="accentFill" x="886" y="148" width="178" height="98" rx="16"/>
  <text class="accentText" x="975" y="186" text-anchor="middle" font-size="19" font-weight="650">PASS 2</text>
  <text class="accentText" x="975" y="218" text-anchor="middle" font-size="23" font-weight="760">Extraction</text>
  <line class="rule" x1="1074" y1="197" x2="1104" y2="197" stroke-width="4"/>
  <path class="muted" d="M1098 188 L1110 197 L1098 206 Z"/>
  <rect class="gateFill" x="1118" y="148" width="112" height="98" rx="16"/>
  <text class="gateText" x="1174" y="187" text-anchor="middle" font-size="18" font-weight="650">EVAL</text>
  <text class="gateText" x="1174" y="218" text-anchor="middle" font-size="23" font-weight="760">Gate</text>
  <rect class="card" x="654" y="296" width="576" height="164" rx="20"/>
  <text class="muted" x="690" y="339" font-size="20" font-weight="680" letter-spacing="1">SEPARATE COUNT</text>
  <text class="ink" x="690" y="386" font-size="42" font-weight="760">202 cases</text>
  <text class="muted" x="690" y="424" font-size="22">Authoring corpus, not the replay total</text>
  <text class="accentText" x="654" y="524" font-size="20" font-weight="650">Local fixture-mode UI | no invented metrics</text>
</svg>
