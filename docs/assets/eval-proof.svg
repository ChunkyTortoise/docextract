<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">DocExtract deterministic evaluation proof</title>
  <desc id="desc">A 95.5 percent field-level score from a deterministic 28-fixture replay, with the 202-case authoring corpus labeled separately. Below, extraction pass one flows to extraction pass two and then to the evaluation gate before the feature inventory.</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bg { fill: #f7f9fc; }
    .card { fill: #fff; stroke: #c6d0de; }
    .ink { fill: #10213a; }
    .muted { fill: #526177; }
    .rule { stroke: #c6d0de; }
    .accentText { fill: #0f766e; }
    .accentFill { fill: #ccfbf1; }
    .blueText { fill: #0c4a6e; }
    .blueFill { fill: #e0f2fe; }
    .gateText { fill: #166534; }
    .gateFill { fill: #dcfce7; }
    .strip { fill: #edf2f7; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #07111f; }
      .card { fill: #101c2e; stroke: #34445b; }
      .ink { fill: #f8fafc; }
      .muted { fill: #bac6d8; }
      .rule { stroke: #34445b; }
      .accentText { fill: #5eead4; }
      .accentFill { fill: #123c3b; }
      .blueText { fill: #7dd3fc; }
      .blueFill { fill: #12334a; }
      .gateText { fill: #86efac; }
      .gateFill { fill: #153d29; }
      .strip { fill: #172438; }
    }
  </style>
  <rect class="bg" width="960" height="960"/>
  <text class="accentText" x="48" y="62" font-size="22" font-weight="700" letter-spacing="2">DOCEXTRACT</text>
  <text class="ink" x="48" y="116" font-size="42" font-weight="750">Replay the evidence first</text>
  <text class="muted" x="48" y="154" font-size="24">Fixture-backed document intelligence with an explicit eval gate.</text>
  <rect class="card" x="48" y="195" width="864" height="220" rx="22"/>
  <text class="accentText" x="82" y="286" font-size="82" font-weight="780">95.5%</text>
  <text class="ink" x="84" y="328" font-size="27" font-weight="700">field-level score</text>
  <text class="muted" x="84" y="363" font-size="22">Deterministic replay</text>
  <line class="rule" x1="458" y1="226" x2="458" y2="385" stroke-width="2"/>
  <text class="ink" x="500" y="260" font-size="42" font-weight="760">28 fixtures</text>
  <text class="muted" x="500" y="294" font-size="21">Replay behind the score</text>
  <line class="rule" x1="500" y1="316" x2="872" y2="316" stroke-width="2"/>
  <text class="ink" x="500" y="360" font-size="34" font-weight="720">202 cases</text>
  <text class="muted" x="682" y="360" font-size="21">Authoring corpus</text>
  <text class="accentText" x="500" y="391" font-size="20" font-weight="650">Separate count, not the replay total</text>
  <rect class="card" x="48" y="445" width="864" height="390" rx="22"/>
  <text class="ink" x="82" y="498" font-size="30" font-weight="740">Two-pass extraction and eval gate</text>
  <rect class="blueFill" x="84" y="530" width="792" height="68" rx="14"/>
  <circle class="blueText" cx="122" cy="564" r="21"/>
  <text x="122" y="572" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">1</text>
  <text class="blueText" x="163" y="573" font-size="28" font-weight="720">Extraction pass 1</text>
  <line class="rule" x1="480" y1="604" x2="480" y2="624" stroke-width="4"/>
  <path class="muted" d="M470 618 L480 630 L490 618 Z"/>
  <rect class="accentFill" x="84" y="632" width="792" height="68" rx="14"/>
  <circle class="accentText" cx="122" cy="666" r="21"/>
  <text x="122" y="674" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">2</text>
  <text class="accentText" x="163" y="675" font-size="28" font-weight="720">Extraction pass 2</text>
  <line class="rule" x1="480" y1="706" x2="480" y2="726" stroke-width="4"/>
  <path class="muted" d="M470 720 L480 732 L490 720 Z"/>
  <rect class="gateFill" x="84" y="734" width="792" height="68" rx="14"/>
  <circle class="gateText" cx="122" cy="768" r="21"/>
  <path d="M112 768 L120 776 L134 759" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="gateText" x="163" y="777" font-size="28" font-weight="720">Deterministic eval gate</text>
  <rect class="strip" x="48" y="855" width="864" height="70" rx="18"/>
  <text class="muted" x="78" y="898" font-size="22" font-weight="650">After proof: agentic retrieval | local fixture-mode UI | scope notes</text>
</svg>
