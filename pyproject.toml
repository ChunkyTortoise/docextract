[project]
name = "docextract"
version = "0.3.0"
description = "Fixture-backed document intelligence with two-pass extraction, agentic retrieval, and an eval gate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Runtime stack (mirrors requirements_ci.txt; pyproject.toml is the single source of truth).
    "fastapi>=0.115.8,<0.140",
    "starlette>=0.40.0,<0.42",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "redis==5.1.0",
    "arq==0.26.1",
    "anthropic>=0.49.0",
    "openai>=1.50.0",
    "instructor>=0.6.0",
    "google-genai>=1.0.0",
    "opencv-python-headless==4.10.0.84",
    "pytesseract==0.3.13",
    "pdfplumber==0.11.4",
    "pymupdf==1.24.11",
    "boto3==1.35.42",
    "pydantic-settings==2.5.2",
    "pydantic==2.9.2",
    "PyYAML>=6.0",
    "filetype==1.2.0",
    "python-multipart>=0.0.22",
    "sse-starlette==2.1.3",
    "httpx==0.27.2",
    "eml-parser==1.17.5",
    "extract-msg==0.52.0",
    "pgvector==0.3.5",
    "cryptography>=46.0.6",
    "streamlit>=1.54.0",
    "streamlit-extras>=0.4.0",
    "plotly==5.24.1",
    "locust==2.32.1",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "anyio==4.6.2",
    "fakeredis==2.26.1",
    "respx==0.21.1",
    "aiosqlite==0.20.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest-cov==5.0.0",
    "mcp>=1.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.3",
    "scikit-learn>=1.5.0,<1.6",
    "pandas>=2.0.0",
    "aiofiles>=24.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "prometheus-client>=0.21.0",
    "langsmith>=0.1.0",
    "langfuse>=4.2.0",
    "braintrust>=0.26.0",
    "opentelemetry-instrumentation-anthropic>=0.48b0",
    "structlog>=24.0.0",
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
full = [
    # ML training / eval stack (deepeval, ragas, langchain) per requirements_full.txt.
    "deepeval>=1.0.0",
    "ragas>=0.4.3",
    "langchain-anthropic>=0.3.0",
    "datasets>=2.14.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "torch>=2.0.0",
]
demo = [
    # Streamlit Cloud demo deployment (requirements.txt pin set).
    "streamlit>=1.54.0",
    "plotly>=5.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["UP035"]
"tests/conftest.py" = ["E402"]
"tests/unit/test_feedback.py" = ["E402"]
"tests/integration/*" = ["N806"]
"tests/unit/test_llm_tracer.py" = ["F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "silent"
# Type-check is intentionally permissive at the project default while a gradual
# strict-typing ratchet rolls out. New modules added under the override block
# below are checked with disallow_untyped_defs; legacy modules are not gated yet.
# Track the ratchet in a dedicated ADR when it lands.

[[tool.mypy.overrides]]
module = [
    "app.services.reranker",
    "app.schemas.citations",
]
disallow_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"
markers = [
    "e2e: end-to-end tests that hit real external services (deselect with '-m not e2e')",
    "pg: needs a PostgreSQL/pgvector DATABASE_URL (run 'pytest -m pg' against the CI pgvector service)",
]

[tool.setuptools]
# Flat layout with many non-package top-level dirs (site/, evals/, deploy/, docs/,
# prompts/, alembic/, ...). Declare packages explicitly so builds and uv sync
# only ever include the real importable packages.
packages = ["app", "app.api", "app.models", "app.schemas", "app.services", "app.storage", "app.utils", "worker"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
